on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      region:
        required: true
        type: string
      service:
        required: true
        type: string

name: Deploy EKS

jobs:
  cd:
    name: Deploy-${{ inputs.env }}-${{ inputs.service }}
    runs-on: ubuntu-22.04
    permissions:
      id-token: write 
      contents: read
      security-events: write
    environment: ${{ inputs.env }}
    env:
      ENV: ${{ inputs.env }}
      PROJECT: pet
      SERVICE: ${{ inputs.service }}
      REGION: ${{ inputs.region }}
      SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
      SLACK_CHANNEL_ID: ${{ secrets.slack_channel_id }}
      ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
      ACCOUNT_ID: ${{ secrets.account_id }}
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
      GITOPS_REPO_URL: ${{ secrets.GITOPS_REPO_URL }}
      ROLE_ARN: ${{ secrets.ROLE_ARN }}

    steps:
      - name: Start deploy slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL_ID }}
          SLACK_TITLE: Start deploy ${{ env.ENV }}-${{ env.PROJECT }}-${{ env.SERVICE }}
          SLACK_COLOR: "#1b55de"
  
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Add SHORT_SHA env property with commit short sha
        run: |
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
           ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:${{ env.SHORT_SHA }},
           ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:latest
          build-args: |
            VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}
            VITE_REVERB_PATH=${{ secrets.VITE_REVERB_PATH }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          provenance: false
      
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: '${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:${{ env.SHORT_SHA }}'
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'
 
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
            sarif_file: 'trivy-results.sarif'      

      - name: Checkout private tools
        uses: actions/checkout@v4
        with:
          repository: tanphanhue123/gitops-chatapp
          token: ${{ env.GITOPS_REPO_TOKEN }}

      - name: Update Image tags in GitOps repository
        run: |
          DIRECTORIES=($(ls -d helm-chart/*/ | cut -d'/' -f2 | grep -v "database"))
          echo "Found directories in helm-chart: ${DIRECTORIES[*]}"
          
          TAG_VERSION=${{ env.SHORT_SHA }}
          ENV=${{ env.ENV }}
          
          echo "Updating tag to ${TAG_VERSION} in environment: ${ENV}"
          for dir in "${DIRECTORIES[@]}"; do
            if [ -f "helm-chart/${dir}/values-${ENV}.yaml" ]; then
              echo "Updating tag in helm-chart/${dir}/values-${ENV}.yaml"
              sed -i "s/tag:.*$/tag: \"${TAG_VERSION}\"/" "helm-chart/${dir}/values-${ENV}.yaml"
            else
              echo "File helm-chart/${dir}/values-${ENV}.yaml not found. Skipping."
            fi
          done
          
          git remote -v
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected, committing..."
            git add .
            git commit -m "Update tag to ${TAG_VERSION} for ${ENV} environment"
            git push
            echo "Changes pushed successfully"
          else
            echo "No changes detected, skipping commit"
          fi          
        shell: bash

      - name: Deploy fail slack notification
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL_ID }}
          SLACK_TITLE: Deploy ${{ env.ENV }}-${{ env.PROJECT }}-${{ env.SERVICE }} failed
          SLACK_COLOR: "#e80909"

      - name: Deploy success slack notification
        if: ${{ success() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL_ID }}
          SLACK_TITLE: Deploy ${{ env.ENV }}-${{ env.PROJECT }}-${{ env.SERVICE }} succeeded

      - name: Stop deploy slack notification
        if: ${{ cancelled() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL_ID }}
          SLACK_TITLE: Deploy ${{ env.ENV }}-${{ env.PROJECT }}-${{ env.SERVICE }} cancelled
          SLACK_COLOR: "#fae102"
